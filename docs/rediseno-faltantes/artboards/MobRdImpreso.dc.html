<div class="ph" style="height: 844px">
<div class="ghost" aria-hidden="true"><div class="gc"></div><div class="gc"></div></div>
<div class="scrim" aria-hidden="true"></div>
<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="im-t">
<div class="grab" aria-hidden="true"></div>
<div class="sh"><h2 id="im-t">Nuevo impreso</h2><button type="button" class="ib" aria-label="Cerrar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<div class="sb">
<div class="field"><label for="im-n">Nombre <span class="req">*</span></label><input id="im-n" class="inp" type="text" placeholder="Ej: Logo, Estampa 25×25" value="Estampa 25×25"></div>
<div class="field"><span class="fl">Tipo de papel</span><div class="seg" role="radiogroup" aria-label="Tipo de papel"><button type="button" role="radio" aria-checked="false">Sublimación</button><button type="button" class="on" role="radio" aria-checked="true">DTF</button><button type="button" role="radio" aria-checked="false">DTF UV</button></div></div>
<div class="two">
<div class="field"><label for="im-a">Ancho (cm) <span class="req">*</span></label><input id="im-a" class="inp" type="text" inputmode="decimal" value="25"></div>
<div class="field"><label for="im-l">Largo (cm) <span class="req">*</span></label><input id="im-l" class="inp" type="text" inputmode="decimal" value="25"></div>
</div>
<div style="background: #F4F8FB; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #334B5C"><span>Tamaño: 25 × 25 cm</span><b style="font-size: 15px; color: #0F2A3A">Costo estimado del papel: $ 1.500</b><span class="hint">Calculado con los precios por m² configurados arriba</span></div>
</div>
<div class="sfoot"><button type="button" class="btn btn-s" style="flex: 0 0 120px">Cancelar</button><button type="button" class="btn btn-p">Crear impreso</button></div>
</div>
</div>
