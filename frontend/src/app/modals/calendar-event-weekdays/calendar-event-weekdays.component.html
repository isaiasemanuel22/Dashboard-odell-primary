<div class="cal-days">
  <span class="cal-days__label" id="cal-days-label">Días de la semana</span>
  <div class="cal-days__row" role="group" aria-labelledby="cal-days-label">
    @for (label of labels; track $index) {
      <button
        type="button"
        class="cal-days__day"
        [class.is-on]="isOn($index + 1)"
        [attr.aria-pressed]="isOn($index + 1)"
        (click)="toggleDay.emit($index + 1)"
      >
        {{ label }}
      </button>
    }
  </div>
  @if (hint) {
    <p class="cal-days__hint">{{ hint }}</p>
  }
</div>
