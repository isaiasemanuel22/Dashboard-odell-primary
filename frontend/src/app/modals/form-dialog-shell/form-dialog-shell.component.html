<div [ngClass]="modalClass()">
  <header [ngClass]="headerClass()">
    <div class="modal__heading">
      <h3>{{ title }}</h3>
      @if (subtitle) {
        <p [innerHTML]="subtitleWithRequiredMark"></p>
      }
    </div>
    <db-button
      variant="secondary"
      format="icon"
      ariaLabel="Cerrar"
      (clicked)="close.emit()"
    >
      <svg
        viewBox="0 0 24 24"
        width="20"
        height="20"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </db-button>
  </header>
  <div class="modal__body">
    <ng-content />
  </div>
  <div class="modal__footer modal__footer--bar"><ng-content select="[modalFooter]" /></div>
</div>
