<div
  class="db-pill-group"
  [class.db-pill-group--sm]="size() === 'sm'"
  role="group"
  [attr.aria-label]="ariaLabel()">
  @if (label(); as lbl) {
    <span class="db-pill-group__label">{{ lbl }}</span>
  }
  @for (opt of options(); track opt.value) {
    <button
      type="button"
      class="db-pill"
      [class.is-active]="opt.value === value()"
      [attr.aria-pressed]="opt.value === value()"
      (click)="select(opt)">
      @if (opt.color) {
        <span class="db-pill__dot" [style.background]="opt.color" aria-hidden="true"></span>
      }
      {{ opt.label }}
    </button>
  }
</div>
