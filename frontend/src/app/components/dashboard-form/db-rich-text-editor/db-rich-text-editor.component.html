<db-form-field
  [label]="label"
  [hint]="fieldHint"
  [error]="fieldError"
  [required]="false"
  [forId]="editorId"
>
  <div class="rich-text" [class.rich-text--disabled]="disabled">
    @if (uploadingImage) {
      <p class="rich-text__status">Subiendo imagen…</p>
    }
    <quill-editor
      [id]="editorId"
      theme="snow"
      format="html"
      bounds="self"
      [modules]="modules"
      [placeholder]="placeholder"
      [readOnly]="disabled"
      [styles]="editorStyles"
      [ngModel]="value"
      (ngModelChange)="onModelChange($event)"
      (onBlur)="onBlur()"
    />
    <p
      class="rich-text__count"
      [class.rich-text__count--over]="isOverLimit"
      aria-live="polite"
    >
      {{ charCount }}
    </p>
  </div>
</db-form-field>
