@if (isMobile) {
  <div class="m-card m-card--flush sales-table-m">
    @for (entry of entries; track entry.id) {
      <button type="button" class="m-row" (click)="openEntry(entry)">
        <span class="sales-table-m__av" aria-hidden="true">{{
          entryAvatar(entry)
        }}</span>
        <div class="m-row__text">
          <b>{{ entryTitle(entry) }}</b>
          <span>{{ entryMeta(entry) }}</span>
        </div>
        <div class="sales-table-m__end">{{ entry.total | currencyArs }}</div>
      </button>
    }
  </div>
} @else {
  <db-data-table
    label="Ventas"
    [rows]="entries"
    [columns]="columns"
    [actions]="actions"
    [clientSide]="false"
    (action)="onAction($event)"
  >
    <ng-template odlCell="saleId" let-entry>
      @if (entry.orderId) {
        <a [routerLink]="['/pedidos', entry.orderId]" class="order-link">{{ entry.saleId }}</a>
      } @else {
        <strong>{{ entry.saleId }}</strong>
      }
    </ng-template>
    <ng-template odlCell="source" let-entry>
      <app-sale-source-badge [source]="entry.source" />
    </ng-template>
    <ng-template odlCell="detail" let-entry>
      <ul class="sale-entry-row__items">
        @for (item of entry.items; track $index) {
          <app-sale-entry-item [item]="item" />
        }
      </ul>
      @if (entry.customerName && entry.source === orderSource) {
        <small class="sale-entry-row__customer">Cliente: {{ entry.customerName }}</small>
      }
    </ng-template>
  </db-data-table>
}
