<div [ngClass]="modalClass()">
  <header [ngClass]="headerClass()">
    <div class="modal__heading">
      <h3>{{ title }}</h3>
      @if (subtitle) {
        <p>{{ subtitle }}</p>
      }
    </div>
    <db-button
      label="✕"
      variant="secondary"
      format="icon"
      ariaLabel="Cerrar"
      (clicked)="close.emit()"
    />
  </header>
  <div class="modal__body">
    <ng-content />
  </div>
</div>
