<div class="m-stepper" role="group" [attr.aria-label]="ariaLabel">
  <button
    type="button"
    [attr.aria-label]="decrementAriaLabel"
    [disabled]="!canDecrement"
    (click)="decrement()"
  >
    −
  </button>
  <span>{{ value }}</span>
  <button
    type="button"
    [attr.aria-label]="incrementAriaLabel"
    [disabled]="disabled"
    [attr.aria-disabled]="atMax ? true : null"
    (click)="increment()"
  >
    +
  </button>
</div>
