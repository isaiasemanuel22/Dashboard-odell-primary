<section class="sales-stats-grid">
  <div class="sales-stats-grid__cards">
    <app-sale-stat-card
      label="Vendido del mes"
      [value]="stats.monthlyRevenue"
      [breakdown]="revenueBreakdown"
      variant="revenue"
    />
    <app-sale-stat-card
      label="Costos del mes"
      [value]="stats.monthlyCost"
      [breakdown]="costBreakdown"
      variant="cost"
    />
    <app-sale-stat-card
      label="Ganancia neta del mes"
      [value]="stats.monthlyNetProfit"
      [detail]="netProfitDetail"
      [breakdown]="profitBreakdown"
      variant="profit"
    />
    <app-sale-stat-card
      label="Vendido en pedidos"
      [value]="stats.monthlyOrdersRevenue"
      [detail]="ordersDetail"
      variant="revenue-soft"
    />
    <app-sale-stat-card
      label="Vendido en mostrador"
      [value]="stats.monthlyRetailRevenue"
      [detail]="retailDetail"
      variant="revenue-soft"
    />
    <app-sale-stat-card
      label="Facturado"
      [value]="stats.invoicedRevenue"
      [detail]="invoicedDetail"
      variant="accent"
    />
    <article class="sales-stats-grid__cap">
      <span class="sales-stats-grid__cap-label">Facturado últimos 12 meses</span>
      <strong class="sales-stats-grid__cap-value">
        {{ stats.last12MonthsInvoicedRevenue | currencyArs }}
      </strong>
      @if (stats.annualInvoiceCap) {
        <div
          class="sales-stats-grid__track"
          role="progressbar"
          aria-label="Facturado contra el tope de la categoría"
          aria-valuemin="0"
          aria-valuemax="100"
          [attr.aria-valuenow]="capPercent"
        >
          <div
            class="sales-stats-grid__fill"
            [class.sales-stats-grid__fill--warn]="capPercent >= 85"
            [style.width.%]="capPercent"
          ></div>
        </div>
        <small class="sales-stats-grid__cap-note">
          {{ capPercentLabel }} % del tope de {{ stats.annualInvoiceCap | currencyArs }}
        </small>
      } @else {
        <small class="sales-stats-grid__cap-note">
          <a routerLink="/ajustes/integraciones">Cargá el tope de tu categoría en Integraciones</a>
        </small>
      }
    </article>
  </div>

  <app-area-profit-balance [balances]="stats.profitByArea" />
</section>
