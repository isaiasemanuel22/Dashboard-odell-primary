<section class="settings-card">
  <app-user-access-head
    [detail]="'Perfiles, roles y áreas de trabajo · ' + activeUserLabel"
  >
    <db-button
      label="+ Nuevo usuario"
      variant="primary"
      format="solid"
      (clicked)="openCreate()"
    />
  </app-user-access-head>

  @if (error && !modalOpen) {
    <div class="error-banner">{{ error }}</div>
  }

  <db-state-message
    [loading]="loading"
    [empty]="!loading && users.length === 0"
    loadingMessage="Cargando usuarios..."
    emptyMessage="Todavía no hay usuarios registrados."
  >
    <db-button
      emptyActions
      label="Crear primer usuario"
      variant="primary"
      format="solid"
      (clicked)="openCreate()"
    />
  </db-state-message>

  @if (!loading && users.length) {
    <div class="access-toolbar">
      <app-user-access-nav />
      <label class="list-search">
        <span aria-hidden="true">⌕</span>
        <input
          type="search"
          placeholder="Buscar por nombre o email"
          [(ngModel)]="search"
          name="userSearch"
        />
      </label>
    </div>

    <db-data-table
      label="Usuarios"
      [rows]="visibleUsers"
      [columns]="userColumns"
      [actions]="userActions"
      [clientSide]="false"
      emptyText="No hay usuarios que coincidan con la búsqueda."
      (action)="onUserAction($event)"
    >
      <ng-template odlCell="roles" let-user>
        <div class="chip-row">
          @for (roleId of user.roleIds; track roleId) {
            <span class="role-pill">{{ roleName(roleId) }}</span>
          } @empty {
            <span class="role-pill">Sin roles</span>
          }
        </div>
      </ng-template>
      <ng-template odlCell="areas" let-user>
        <div class="chip-row">
          @for (area of userAreas(user); track area.id) {
            <db-area-chip [area]="area.slug" [label]="area.name" />
          } @empty {
            <db-area-chip area="general" label="Sin áreas" />
          }
        </div>
      </ng-template>
    </db-data-table>
  }
</section>

@if (modalOpen) {
  <app-form-modal
    [title]="editing ? 'Editar usuario' : 'Nuevo usuario'"
    size="md"
    (close)="closeModal()"
  >
    @if (error) {
      <div class="error-banner">{{ error }}</div>
    }

    <app-users-admin-form
      [error]="error"
      [form]="form"
      [roles]="roles"
      [saving]="saving"
      (roleToggle)="toggleRole($event.roleId, $event.checked)"
      (cancelEdit)="closeModal()"
      (save)="save()"
    />
  </app-form-modal>
}
