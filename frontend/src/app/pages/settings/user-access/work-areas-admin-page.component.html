@if (isMobile()) {
  <app-settings-users-mobile-shell>
    <button
      barAction
      type="button"
      class="m-ib"
      aria-label="Crear un área"
      (click)="openCreate()"
    >
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
    </button>

    @if (error && !modalOpen) {
      <div class="st-m__note st-m__note--w">{{ error }}</div>
    }

    @if (loading) {
      <db-state-message [loading]="true" loadingMessage="Cargando áreas..." />
    } @else {
      <div class="m-card m-card--flush">
        @for (area of areas; track area.id) {
          <button type="button" class="m-row" (click)="openEdit(area)">
            <div class="m-row__text">
              <b>{{ area.name }}</b>
              <span>{{ area.slug || 'Sin identificador' }} · orden {{ area.sortOrder }}</span>
            </div>
            <span class="m-pill" [class.m-pill--ok]="area.active">{{ area.active ? 'Activa' : 'Inactiva' }}</span>
          </button>
        } @empty {
          <div class="m-row">
            <div class="m-row__text">
              <b>Sin áreas</b>
              <span>Creá la primera</span>
            </div>
          </div>
        }
      </div>
    }
  </app-settings-users-mobile-shell>
} @else {
  <section class="settings-card">
    <app-user-access-head>
      <db-button
        label="+ Nueva área"
        variant="primary"
        format="solid"
        (clicked)="openCreate()"
      />
    </app-user-access-head>

    <app-user-access-nav />

    @if (error && !modalOpen) {
      <div class="error-banner">{{ error }}</div>
    }

    <db-state-message
      [loading]="loading"
      [empty]="!loading && areas.length === 0"
      loadingMessage="Cargando áreas..."
      emptyMessage="Todavía no hay áreas configuradas."
    >
      <db-button
        emptyActions
        label="Crear primera área"
        variant="primary"
        format="solid"
        (clicked)="openCreate()"
      />
    </db-state-message>

    @if (!loading) {
      <db-data-table
        label="Áreas de trabajo"
        [rows]="areas"
        [columns]="areaColumns"
        [actions]="areaActions"
        [clientSide]="false"
        emptyText="No hay áreas de trabajo."
        (action)="onAreaAction($event)"
      />
    }
  </section>
}

@if (modalOpen) {
  <app-form-modal
    [title]="editing ? 'Editar área' : 'Nueva área'"
    size="md"
    (close)="closeModal()"
  >
    @if (error) {
      <div class="error-banner">{{ error }}</div>
    }

    <div class="form-grid">
      <db-input label="Nombre" name="areaName" [(ngModel)]="form.name" />
      <db-input label="Identificador (opcional)" name="areaSlug" [(ngModel)]="form.slug" />
      <db-input
        label="Orden"
        type="number"
        name="areaOrder"
        [min]="0"
        [(ngModel)]="form.sortOrder"
      />
      <db-checkbox label="Área activa" name="areaActive" [(ngModel)]="form.active" />
    </div>

    <div class="form-actions">
      <db-button
        label="Cancelar"
        variant="secondary"
        format="soft"
        [disabled]="saving"
        (clicked)="closeModal()"
      />
      <db-button
        [label]="saving ? 'Guardando…' : 'Guardar'"
        variant="primary"
        format="solid"
        [disabled]="saving"
        (clicked)="save()"
      />
    </div>
  </app-form-modal>
}
