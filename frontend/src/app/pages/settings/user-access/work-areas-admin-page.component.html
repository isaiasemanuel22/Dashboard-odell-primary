<section class="settings-card">
  <app-user-access-head>
    <db-button
      label="+ Nueva área"
      variant="primary"
      format="solid"
      (clicked)="openCreate()"
    />
  </app-user-access-head>

  <app-user-access-nav />

  @if (error && !modalOpen) {
  <div class="error-banner">{{ error }}</div>
}

<db-state-message
  [loading]="loading"
  [empty]="!loading && areas.length === 0"
  loadingMessage="Cargando áreas..."
  emptyMessage="Todavía no hay áreas configuradas."
>
  <db-button
    emptyActions
    label="Crear primera área"
    variant="primary"
    format="solid"
    (clicked)="openCreate()"
  />
</db-state-message>

@if (!loading) {
  <db-data-table
    label="Áreas de trabajo"
    [rows]="areas"
    [columns]="areaColumns"
    [actions]="areaActions"
    [clientSide]="false"
    emptyText="No hay áreas de trabajo."
    (action)="onAreaAction($event)"
  />
}
</section>

@if (modalOpen) {
  <app-form-modal
    [title]="editing ? 'Editar área' : 'Nueva área'"
    size="md"
    (close)="closeModal()"
  >
    @if (error) {
      <div class="error-banner">{{ error }}</div>
    }

    <div class="form-grid">
      <db-input label="Nombre" name="areaName" [(ngModel)]="form.name" />
      <db-input label="Identificador (opcional)" name="areaSlug" [(ngModel)]="form.slug" />
      <db-input
        label="Orden"
        type="number"
        name="areaOrder"
        [min]="0"
        [(ngModel)]="form.sortOrder"
      />
      <db-checkbox label="Área activa" name="areaActive" [(ngModel)]="form.active" />
    </div>

    <div class="form-actions">
      <db-button
        label="Cancelar"
        variant="secondary"
        format="soft"
        [disabled]="saving"
        (clicked)="closeModal()"
      />
      <db-button
        [label]="saving ? 'Guardando…' : 'Guardar'"
        variant="primary"
        format="solid"
        [disabled]="saving"
        (clicked)="save()"
      />
    </div>
  </app-form-modal>
}
