<db-mobile-settings-page title="Equipo">
  <ng-content select="[barAction]" />

  <div tabs class="st-m__tabs" role="tablist" aria-label="Sección">
    <a
      class="st-m__tab"
      routerLink="/ajustes/usuarios/usuarios"
      routerLinkActive="st-m__tab--on"
      role="tab"
    >Usuarios</a>
    <a
      class="st-m__tab"
      routerLink="/ajustes/usuarios/roles"
      routerLinkActive="st-m__tab--on"
      role="tab"
    >Roles</a>
    <a
      class="st-m__tab"
      routerLink="/ajustes/usuarios/areas"
      routerLinkActive="st-m__tab--on"
      role="tab"
    >Áreas</a>
  </div>

  <ng-content />
</db-mobile-settings-page>
