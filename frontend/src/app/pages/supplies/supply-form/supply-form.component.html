<db-form>
  <form (ngSubmit)="onSubmit()" autocomplete="off">
    <db-select
      label="Categoría"
      [(ngModel)]="category"
      name="category"
      [options]="supplyCategoryOptions"
      (ngModelChange)="onCategoryChange()"
    />

    <db-input
      label="Nombre"
      [(ngModel)]="name"
      name="name"
      [required]="true"
    />

    <app-supply-form-material
      [isFilament]="isFilament"
      [isResin]="isResin"
      [showColorField]="showColorField"
      [filamentType]="filamentType"
      (filamentTypeChange)="filamentType = $event; onFilamentTypeChange()"
      [resinType]="resinType"
      (resinTypeChange)="resinType = $event; onResinTypeChange()"
      [brand]="brand"
      (brandChange)="onMaterialBrandChange($event)"
      [colorId]="colorId"
      (colorIdChange)="colorId = $event"
      [selectedColorHex]="selectedColorHex"
      [filamentTypeOptions]="filamentTypeOptions"
      [resinTypeOptions]="resinTypeOptions"
      [filamentBrandOptions]="filamentBrandOptions"
      [resinBrandOptions]="resinBrandOptions"
      [colorOptions]="colorOptions"
    />

    <db-select
      label="Unidad de medida"
      [(ngModel)]="unit"
      name="unit"
      [required]="true"
      [disabled]="priceFromSettings"
      [hint]="unitHint"
      [options]="unitOptions"
    />

    <db-form-grid>
      <db-input
        [label]="'Cantidad (' + unit + ')'"
        type="number"
        [(ngModel)]="quantity"
        name="quantity"
        step="0.01"
        [required]="true"
      />
      <db-input
        label="Stock mínimo"
        type="number"
        [(ngModel)]="minStock"
        name="minStock"
        [min]="0"
        step="0.01"
        [required]="true"
      />
    </db-form-grid>

    <db-input
      [label]="'Precio unitario (ARS/' + unit + ')'"
      [hint]="priceHint"
      type="number"
      [(ngModel)]="unitPrice"
      name="unitPrice"
      [min]="0"
      [readonly]="!priceEditable"
      [required]="true"
    />

    <db-input
      label="Proveedor (opcional)"
      [(ngModel)]="supplier"
      name="supplier"
    />

    @if (error || configError) {
      <db-form-error>{{ error || configError }}</db-form-error>
    }

    <db-form-footer>
      <db-button
        label="Cancelar"
        variant="cancel"
        format="soft"
        (clicked)="cancel.emit()"
      />
      <db-button
        [label]="loading ? 'Guardando...' : (supply ? 'Guardar' : 'Crear insumo')"
        variant="primary"
        format="solid"
        buttonType="submit"
        [disabled]="loading"
      />
    </db-form-footer>
  </form>
</db-form>
