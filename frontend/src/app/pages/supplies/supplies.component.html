<header class="page-header">
  <div>
    <h2>Insumos</h2>
    <p>
      Control de filamentos, resinas, tintas, textiles y más ·
      {{ supplies.length }} {{ supplies.length === 1 ? 'insumo' : 'insumos' }}
      @if (lowStockCount) {
        · <span class="tone-danger">{{ lowStockCount }} con stock bajo</span>
      }
    </p>
  </div>
  <div class="header-actions">
    <db-button
      label="Registrar compra"
      variant="primary-outline"
      format="solid"
      (clicked)="openPurchase()"
    />
    <db-button
      label="+ Nuevo insumo"
      variant="primary"
      format="solid"
      (clicked)="openCreate()"
    />
  </div>
</header>

<div class="list-toolbar">
  <db-pill-group
    [options]="stockFilters"
    [value]="stockFilter"
    ariaLabel="Estado de stock"
    (valueChange)="stockFilter = $event"
  />
  <label class="list-search">
    <span aria-hidden="true">⌕</span>
    <input
      type="search"
      placeholder="Buscar por nombre, marca o material"
      [(ngModel)]="search"
    />
  </label>
</div>

<db-pill-group
  class="list-areas"
  [options]="categoryFilters"
  [value]="categoryFilter"
  label="Categoría"
  size="sm"
  ariaLabel="Filtrar por categoría"
  (valueChange)="categoryFilter = $event"
/>

<db-state-message
  [loading]="loading"
  [empty]="!loading && filteredSupplies.length === 0"
  loadingMessage="Cargando insumos..."
  [emptyMessage]="emptyMessage"
>
  @if (!supplies.length) {
    <db-button
      emptyActions
      label="Crear primer insumo"
      variant="primary"
      format="solid"
      (clicked)="openCreate()"
    />
  }
</db-state-message>

@if (!loading && filteredSupplies.length) {
  <app-supplies-table
    [supplies]="filteredSupplies"
    [colorCatalog]="colorCatalog"
    (edit)="openEdit($event)"
    (delete)="deleteSupply($event)"
  />
}
