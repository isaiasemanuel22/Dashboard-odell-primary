<header class="page-header">
  <div>
    <h2>Impresos</h2>
    <p>Tamaños de papeles impresos (logo, estampas, etc.)</p>
  </div>
  <button type="button" class="btn primary" (click)="openCreate()">+ Nuevo impreso</button>
</header>

<div class="toolbar">
  <div class="type-filters">
    @for (filter of typeFilters; track filter.value) {
      <button
        type="button"
        class="filter-btn"
        [class.active]="paperFilter === filter.value"
        (click)="paperFilter = filter.value"
      >
        {{ filter.label }}
      </button>
    }
  </div>
  <input type="search" [(ngModel)]="search" placeholder="Buscar..." class="search-input" />
</div>

@if (loading) {
  <div class="loading">Cargando impresos...</div>
} @else {
  <db-data-table
    label="Impresos"
    [rows]="filteredImpresos"
    [columns]="columns"
    [actions]="actions"
    [loading]="loading"
    [clientSide]="false"
    emptyText="No hay impresos."
    (action)="onAction($event)"
  />
}

@if (showForm) {
  <app-impreso-form
    [impreso]="editing"
    [loading]="formLoading"
    [error]="formError"
    (save)="onSave($event)"
    (cancel)="closeForm()"
  />
}
