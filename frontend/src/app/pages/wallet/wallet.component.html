<header class="page-header">
  <div>
    <h2>Billetera</h2>
    <p>
      Lo cobrado, separado por cuenta · {{ periodLabel }}
      @if (overview && overview.availableBalance < 0) {
        · <span class="tone-danger">saldo negativo</span>
      }
    </p>
  </div>
  <div class="header-actions">
    <db-button
      label="Transferir entre cuentas"
      variant="secondary"
      format="soft"
      [disabled]="loading || !overview"
      (clicked)="openTransferForm()"
    />
    <db-button
      label="Pagar"
      variant="secondary"
      format="soft"
      [disabled]="loading || !overview"
      (clicked)="openPaymentForm()"
    />
    <db-button
      label="Prestar"
      variant="secondary"
      format="soft"
      [disabled]="loading || !overview"
      (clicked)="openLoanForm()"
    />
    <db-button
      label="+ Agregar registro"
      variant="primary"
      format="solid"
      [disabled]="loading || !overview"
      (clicked)="openForm()"
    />
  </div>
</header>

@if (loadError) {
  <db-state-message
    [empty]="true"
    emptyMessage="No se pudo cargar la billetera."
  >
    <db-button
      emptyActions
      label="Reintentar"
      variant="secondary"
      format="soft"
      (clicked)="loadOverview()"
    />
  </db-state-message>
} @else if (loading) {
  <db-state-message [loading]="true" loadingMessage="Cargando billetera..." />
} @else if (overview) {
  <app-wallet-metrics [overview]="overview" [clientDebt]="clientDebt" />
  <app-wallet-movements
    [movements]="overview.movements"
    [expenses]="overview.expenses"
    (action)="onMovementAction($event)"
  />
  <app-wallet-debtors
    [debtors]="overview.debtors"
    [expenses]="overview.expenses"
    (repay)="openRepaymentForm($event)"
  />
}

@if (showForm) {
  <app-wallet-record-form
    [mode]="formMode"
    [expense]="editingExpense"
    [startAsPurchase]="purchasePreset"
    [supplies]="supplies"
    [nameSuggestions]="overview?.recordNameSuggestions ?? []"
    [recipientSuggestions]="overview?.recipientNameSuggestions ?? []"
    (closed)="closeForm()"
    (saved)="onFormSaved()"
  />
}

@if (showTransferForm) {
  <app-wallet-transfer-form
    (closed)="closeTransferForm()"
    (saved)="onTransferSaved()"
  />
}

@if (repaymentDebtor) {
  <app-wallet-repayment-form
    [debtor]="repaymentDebtor"
    (closed)="closeRepaymentForm()"
    (saved)="onRepaymentSaved()"
  />
}

@if (voidingExpense) {
  <app-wallet-void-form
    [expense]="voidingExpense"
    (closed)="closeVoidForm()"
    (saved)="onVoidSaved()"
  />
}
