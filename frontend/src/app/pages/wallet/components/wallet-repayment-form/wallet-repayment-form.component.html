<app-form-modal
  title="Registrar devolución"
  size="ml"
  [footerBar]="true"
  (close)="closed.emit()"
>
  <form class="wallet-form form" (ngSubmit)="submitRepayment()" novalidate>
    <section class="wallet-form__section">
      <div class="wallet-form__section-head wallet-form__section-head--debtor">
        <h4>{{ debtor.name }}</h4>
        <p>
          Deuda pendiente:
          <strong>{{ debtor.amount | currencyArs }}</strong>
        </p>
      </div>

      <db-form-grid class="wallet-form__grid-2">
        <db-input
          label="Fecha"
          type="date"
          [(ngModel)]="repaymentDate"
          name="repaymentDate"
          [required]="true"
          [max]="maxExpenseDate"
        />

        <db-select
          label="Cuenta"
          [(ngModel)]="account"
          name="account"
          [options]="accountOptions"
          [required]="true"
        />

        <db-form-grid-full>
          <db-input
            label="Monto a devolver"
            type="number"
            min="1"
            step="1"
            [(ngModel)]="repaymentAmount"
            name="repaymentAmount"
            placeholder="0"
            [required]="true"
            (ngModelChange)="onRepaymentAmountChange()"
          />
        </db-form-grid-full>
      </db-form-grid>

      <div class="wallet-summary wallet-summary--payback">
        <span class="wallet-summary__label">Ingreso a registrar</span>
        <strong class="wallet-summary__amount">
          {{ repaymentAmount | currencyArs }}
        </strong>
      </div>
    </section>

    @if (repaymentError) {
      <p class="wallet-form__error" role="alert">{{ repaymentError }}</p>
    }

    <footer class="wallet-form__footer wallet-form__footer--keep-cancel form-footer">
      <db-button
        label="Cancelar"
        variant="secondary"
        format="soft"
        [disabled]="repaymentSaving"
        (clicked)="closed.emit()"
      />
      <db-button
        [label]="repaymentSaving ? 'Guardando...' : 'Registrar devolución'"
        variant="primary"
        format="solid"
        buttonType="submit"
        [disabled]="repaymentSaving"
      />
    </footer>
  </form>
</app-form-modal>
