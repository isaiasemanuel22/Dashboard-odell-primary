<app-form-modal
  title="Anular movimiento"
  size="md"
  [footerBar]="true"
  [confirm]="true"
  (close)="closed.emit()"
>
  <form class="wallet-form form" (ngSubmit)="submitVoid()" novalidate>
    <app-confirm-lead tone="danger" title="¿Anular este movimiento?">
      <p>
        {{ expense.name }} · {{ expense.amount | currencyArs }}. Anular no
        borra el historial: deja el movimiento tachado con el motivo.
      </p>
      <ng-container ngProjectAs="[confirmFields]">
        <db-input
          label="Motivo"
          [(ngModel)]="reason"
          name="voidReason"
          [required]="true"
          placeholder="Ej: cargado dos veces"
        />
      </ng-container>
    </app-confirm-lead>

    @if (formError) {
      <p class="wallet-form__error" role="alert">{{ formError }}</p>
    }

    <footer class="wallet-form__footer form-footer">
      <db-button
        label="Cancelar"
        variant="secondary"
        format="soft"
        [disabled]="saving"
        (clicked)="closed.emit()"
      />
      <db-button
        [label]="saving ? 'Anulando...' : 'Anular movimiento'"
        variant="delete"
        format="solid"
        extraClass="db-button--danger-solid"
        buttonType="submit"
        [disabled]="saving"
      />
    </footer>
  </form>
</app-form-modal>
