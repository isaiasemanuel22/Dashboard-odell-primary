<header class="cola-header">
  <div class="cola-header__intro">
    <h2>Cola de trabajo</h2>
    <p class="cola-header__stats">
      <span>{{ tasksOnBoardCount }} tareas en el tablero</span>
      <span class="cola-header__dot" aria-hidden="true">·</span>
      <span>{{ backlogCount }} por agregar</span>
      @if (blockedCount) {
        <span class="cola-header__dot" aria-hidden="true">·</span>
        <span class="cola-header__blocked">{{ blockedCount }} bloqueadas</span>
      }
    </p>
  </div>

  <div class="cola-header__actions">
    <label class="cola-search">
      <svg class="cola-search__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input
        type="search"
        class="cola-search__input"
        placeholder="Buscar por pedido o tarea"
        [ngModel]="searchQuery"
        (ngModelChange)="searchQueryChange.emit($event)"
      />
    </label>
    <db-filter-panel
      title="Filtrar cola"
      ariaLabel="Filtros de la cola"
      [groups]="panelGroups"
      [values]="panelValues"
      (apply)="onPanelApply($event)"
    />
    <db-button
      label="+ Nueva tarea"
      variant="primary"
      format="inline"
      (clicked)="newTask.emit()"
    />
  </div>
</header>

@if (statusNotice) {
  <p class="status-notice">{{ statusNotice }}</p>
}
