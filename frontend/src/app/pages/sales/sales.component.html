<header class="page-header">
  <div>
    <h2>Ventas</h2>
    <p>
      Ingresos, costos y ganancias de {{ monthLabel }} · {{ entries.length }} ventas registradas
    </p>
  </div>
  <div class="header-actions">
    <db-button
      label="Generar reporte"
      variant="secondary"
      format="solid"
      [disabled]="loading || !entries.length"
      (clicked)="generateReport()"
    />
    <db-button
      label="+ Venta de mostrador"
      variant="primary"
      format="solid"
      routerLink="/ventas/nueva"
    />
  </div>
</header>

@if (loadError) {
  <db-state-message
    [empty]="true"
    emptyMessage="No se pudo cargar la información de ventas."
  >
    <db-button
      emptyActions
      label="Reintentar"
      variant="secondary"
      format="soft"
      (clicked)="loadData()"
    />
  </db-state-message>
} @else if (loading) {
  <db-state-message [loading]="true" loadingMessage="Cargando ventas..." />
} @else {
  @if (stats) {
    <app-sales-stats-grid [stats]="stats" />
  }

  <section class="sales-list">
    <div>
      <h3>Listado de ventas del mes</h3>
      <p>Ventas de mostrador y pedidos entregados con fecha de entrega en el mes</p>
    </div>

    <db-data-table
      label="Ventas del mes"
      [rows]="entries"
      [columns]="columns"
      [actions]="actions"
      [filters]="sourceFilters"
      [areaFilters]="areaFilters"
      searchPlaceholder="Buscar por ID, producto o cliente"
      [searchText]="searchText"
      [emptyText]="emptyText"
      emptyActionLabel="Registrar una venta de mostrador"
      (action)="onAction($event)"
      (emptyAction)="openCreateSale()"
    />
  </section>
}
