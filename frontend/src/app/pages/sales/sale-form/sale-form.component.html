<db-form [class.sale-form--mobile]="useCardLayout">

    <db-fieldset legend="Carrito">
      <app-sale-form-cart
        [cart]="cart"
        [useCardLayout]="useCardLayout"
        [subtotal]="cartSubtotal"
        [discount]="cartDiscount"
        [total]="cartTotal"
        [profit]="cartProfit"
        [hasDiscount]="hasDiscount"
        (quantityChange)="updateLineQuantity($event.line, $event.quantity)"
        (remove)="removeFromCart($event)"
      />
    </db-fieldset>

    <db-fieldset legend="Descuento">
      <db-form-grid>
        <db-select
          label="Tipo"
          [(ngModel)]="discountMode"
          name="discountMode"
          [options]="discountModeOptions"
        />
        @if (discountMode === 'percent') {
          <db-input
            label="Porcentaje (%)"
            type="number"
            [(ngModel)]="discountPercent"
            name="discountPercent"
            [min]="0"
            [max]="100"
            [step]="1"
          />
        }
        @if (discountMode === 'amount') {
          <db-input
            label="Monto ($)"
            type="number"
            [(ngModel)]="discountAmount"
            name="discountAmount"
            [min]="0"
            [step]="1"
          />
        }
      </db-form-grid>
    </db-fieldset>

    <db-textarea
      label="Notas"
      [(ngModel)]="notes"
      name="notes"
      placeholder="Opcional"
      [rows]="2"
    />

    @if (error) {
      <db-form-error>{{ error }}</db-form-error>
    }

    @if (closeSaleBlockReason) {
      <p class="sale-form__stock-hint">{{ closeSaleBlockReason }}</p>
    }

    <db-form-footer [class.sale-form__footer--sticky]="useCardLayout">
      <db-button
        label="Cancelar"
        variant="cancel"
        format="soft"
        (clicked)="cancelCart()"
      />
      @if (!isEditing) {
        <db-button
          label="Crear pedido"
          variant="secondary"
          format="soft"
          [disabled]="!hasCartItems"
          (clicked)="createOrder()"
        />
      }
      <db-button
        [label]="
          loading
            ? 'Guardando...'
            : isEditing
              ? 'Guardar cambios'
              : 'Cerrar venta'
        "
        variant="primary"
        format="solid"
        [disabled]="!canCloseSale"
        (clicked)="closeSale()"
      />
    </db-form-footer>
  </db-form>
