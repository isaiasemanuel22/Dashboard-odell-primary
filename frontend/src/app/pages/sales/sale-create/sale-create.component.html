<div class="mobile-only">
  <db-mobile-bar
    [title]="mobileTitle"
    closeAriaLabel="Cerrar sin guardar"
    (close)="cancel()"
  />
</div>

<div class="desktop-only">
  <header class="page-header sale-create-header">
    <div>
      <a routerLink="/ventas" class="back-link">← Ventas</a>
      <h2>{{ title }}</h2>
      <p>Mostrador — agregá productos y cerrá la venta</p>
    </div>
  </header>
</div>

@if (loadingSale) {
  <p class="sale-create-loading">Cargando venta...</p>
} @else {
  <section class="panel sale-create-panel">
    <app-sale-form
      [sale]="sale"
      [products]="products"
      [stockByProductId]="stockByProductId"
      [loading]="loading"
      [error]="error"
      layout="mobile"
      (save)="save($event)"
      (cancel)="cancel()"
    />
  </section>
}
