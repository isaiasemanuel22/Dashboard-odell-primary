<div
  class="cost-composition"
  [class.cost-composition--locked]="catalogLocked"
>
  <header class="cost-composition__head">
    <h5 class="cost-composition__title">Composición del costo · por unidad</h5>
    <p class="cost-composition__hint">
      @if (catalogLocked) {
        Datos del catálogo · solo lectura. Si el color viene Indistinto, podés elegirlo.
      } @else {
        Abrí cada bloque para editarlo
      }
    </p>
  </header>

  @if (showProcessToggle && !line.productId) {
    <div class="discount-segments cost-composition__process" role="group" aria-label="Proceso de impresión">
      <button
        type="button"
        class="discount-segment"
        [class.discount-segment--active]="!isResin"
        (click)="setPrintProcess('fdm')"
      >
        Filamento
      </button>
      <button
        type="button"
        class="discount-segment"
        [class.discount-segment--active]="isResin"
        (click)="setPrintProcess('resina')"
      >
        Resina
      </button>
    </div>
  }

  @if (isResin) {
    <app-order-quote-resin-material
      [line]="line"
      [product]="product"
      [lineIndex]="lineIndex"
      (changed)="onChildChanged()"
    />
    <app-order-quote-resin-alcohol
      [line]="line"
      [product]="product"
      [lineIndex]="lineIndex"
      (changed)="onChildChanged()"
    />
    <app-order-quote-resin-wash
      [line]="line"
      [product]="product"
      [lineIndex]="lineIndex"
      (changed)="onChildChanged()"
    />
    <app-order-quote-resin-cure
      [line]="line"
      [product]="product"
      [lineIndex]="lineIndex"
      (changed)="onChildChanged()"
    />
  } @else {
    <app-order-quote-filaments
      [line]="line"
      [product]="product"
      [lineIndex]="lineIndex"
      (changed)="onChildChanged()"
    />
  }

  <app-order-quote-print
    [line]="line"
    [product]="product"
    [lineIndex]="lineIndex"
    (changed)="onChildChanged()"
  />
  <app-order-quote-labor
    [line]="line"
    [product]="product"
    [lineIndex]="lineIndex"
    (changed)="onChildChanged()"
  />
  <app-order-quote-error-margin
    [line]="line"
    [product]="product"
    [lineIndex]="lineIndex"
    [cost]="errorMarginCost"
    [meta]="errorMarginMeta"
    [alwaysShow]="true"
  />
</div>
