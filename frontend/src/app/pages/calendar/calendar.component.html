<header class="page-header cal-head">
  <div>
    <h2>Calendario</h2>
    <p class="cal-head__sub" [innerHTML]="subtitleHtml"></p>
  </div>
  <div class="header-actions">
    <db-button
      label="+ Recordatorio"
      variant="secondary"
      format="soft"
      (clicked)="openNew(reminderKind)"
    />
    <db-button
      label="+ Nuevo evento"
      variant="primary"
      format="solid"
      (clicked)="openNew(eventKind)"
    />
  </div>
</header>

@if (error) {
  <p class="cal-error" role="alert">{{ error }}</p>
}

<div class="cal-bar">
  <div class="cal-nav">
    <button
      type="button"
      class="cal-nav__icon"
      aria-label="Anterior"
      (click)="prevPeriod()"
    >
      ‹
    </button>
    <span class="cal-nav__month" aria-live="polite">{{ monthTitle }}</span>
    <button
      type="button"
      class="cal-nav__icon"
      aria-label="Siguiente"
      (click)="nextPeriod()"
    >
      ›
    </button>
    <db-button
      label="Hoy"
      variant="secondary"
      format="soft"
      (clicked)="goToday()"
    />
  </div>
  <db-segmented-control
    [options]="viewOptions"
    [value]="view"
    ariaLabel="Vista"
    (valueChange)="setView($event)"
  />
</div>

<div class="cal-filters">
  <db-pill-group
    [options]="filterOptions"
    [value]="filter"
    ariaLabel="Filtros"
    (valueChange)="setFilter($event)"
  />
</div>

@if (loading) {
  <p class="cal-loading">Cargando calendario…</p>
} @else {
  <div class="cal-layout">
    <div class="cal-main">
      @if (view === 'month') {
        <db-calendar-month
          [days]="monthCells"
          [ariaLabel]="monthTitle"
          (dayClick)="onDayClick($event)"
          (itemClick)="onItemClick($event)"
        />
      } @else if (view === 'week') {
        <db-calendar-month
          [days]="weekCells"
          ariaLabel="Semana"
          (dayClick)="onDayClick($event)"
          (itemClick)="onItemClick($event)"
        />
      } @else {
        <section class="cal-card">
          <h3 class="cal-card__title">Lista del mes</h3>
          <db-calendar-agenda
            [rows]="listRows"
            emptyText="No hay elementos este mes."
            (toggle)="onAgendaToggle($event)"
            (open)="onAgendaOpen($event)"
          />
        </section>
      }
    </div>

    <aside class="cal-side">
      <section class="cal-card">
        <div class="cal-card__head">
          <h3 class="cal-card__title">Hoy</h3>
          <span class="cal-card__meta">{{ todayLabel }}</span>
        </div>
        <db-calendar-agenda
          [rows]="todayRows"
          emptyText="Sin recordatorios para hoy."
          (toggle)="onAgendaToggle($event)"
        />
      </section>

      <section class="cal-card">
        <div class="cal-card__head">
          <h3 class="cal-card__title cal-card__title--danger">Atrasados</h3>
          @if (overdueCount > 0) {
            <span class="cal-badge">{{ overdueCount }}</span>
          }
        </div>
        <db-calendar-agenda
          [rows]="overdueRows"
          emptyText="No hay entregas atrasadas."
          (open)="onAgendaOpen($event)"
        />
      </section>

      <section class="cal-card">
        <div class="cal-card__head">
          <h3 class="cal-card__title">Próximos 7 días</h3>
          <button type="button" class="cal-card__link" (click)="setView('list')">
            Ver lista
          </button>
        </div>
        <db-calendar-agenda
          [rows]="upcomingRows"
          emptyText="Nada en los próximos 7 días."
          (toggle)="onAgendaToggle($event)"
          (open)="onAgendaOpen($event)"
        />
      </section>
    </aside>
  </div>
}
