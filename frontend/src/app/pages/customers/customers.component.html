<header class="page-header">
  <div>
    <h2>Clientes</h2>
    <p>
      Base de clientes del emprendimiento · {{ customers.length }} clientes
      · {{ companyCount }} con empresa
    </p>
  </div>
  <db-button
    label="+ Nuevo cliente"
    variant="primary"
    format="solid"
    (clicked)="openCreateCustomer()"
  />
</header>

<db-data-table
  label="Clientes"
  [rows]="customers"
  [columns]="columns"
  [actions]="actions"
  [filters]="kindFilters"
  [loading]="loading"
  searchPlaceholder="Buscar por nombre, email o teléfono"
  emptyText="No hay clientes registrados."
  emptyActionLabel="Crear primer cliente"
  (action)="onAction($event)"
  (emptyAction)="openCreateCustomer()"
>
  <ng-template odlCell="email" let-customer>
    @if (customer.email) {
      <a [href]="'mailto:' + customer.email">{{ customer.email }}</a>
    } @else {
      —
    }
  </ng-template>
</db-data-table>
