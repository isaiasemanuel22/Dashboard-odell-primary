<db-form>
  <form [formGroup]="facade.form" (ngSubmit)="onSubmit()" autocomplete="off">
    <app-product-form-basic-fields
      [value]="basicFields"
      [productTypeOptions]="facade.productTypeOptions"
      (valueChange)="onBasicFieldsChange($event)"
    />
    <app-product-form-production-fields
      [form]="facade.form"
      [productType]="productType"
      [includesPieces]="basicFields?.includesPieces ?? false"
    />

    @if (showComponentsSection) {
      <app-product-form-components-section
        [productType]="productType"
        [editingProductId]="product?.id ?? null"
        [value]="componentsValue"
        (valueChange)="onComponentsChange($event)"
      />
    }

    <app-product-form-categories-section
      [productType]="productType"
      [value]="categoryIds"
      (valueChange)="onCategoriesChange($event)"
    />

    <app-product-form-media-section
      #mediaSection
      [facade]="facade"
      [uploadProductImage]="facade.uploadProductImage"
      [uploadProductAttachment]="facade.uploadProductAttachment"
    />

    <app-product-form-pricing-section
      [facade]="facade"
      [form]="facade.form"
    />

    @if (error || facade.imageUploadError) {
      <db-form-error>{{ error || facade.imageUploadError }}</db-form-error>
    }

    <db-form-footer>
      <db-button
        label="Cancelar"
        variant="cancel"
        format="soft"
        (clicked)="cancel.emit()"
      />
      <db-button
        [label]="facade.savingImages || facade.savingAttachments ? 'Subiendo archivos...' : (loading ? 'Guardando...' : (product ? 'Guardar cambios' : 'Crear producto'))"
        variant="primary"
        format="solid"
        buttonType="submit"
        [disabled]="loading || facade.savingImages || facade.savingAttachments || !facade.form.controls.name.value.trim() || facade.categoryIds.length < 1"
      />
    </db-form-footer>
  </form>
</db-form>
