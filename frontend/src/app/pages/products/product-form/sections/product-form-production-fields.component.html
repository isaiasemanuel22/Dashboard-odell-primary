<div [formGroup]="form" class="production-fields">
  @if (showProductionFields && showGenericSizeField) {
    <section class="form-block">
      <h4>Medidas (cm)</h4>
      <div class="measure-row">
        <db-input label="Ancho" type="number" formControlName="sizeWidthCm" [min]="0" [step]="0.1" />
        <db-input label="Largo" type="number" formControlName="sizeLengthCm" [min]="0" [step]="0.1" />
        <db-input label="Alto" type="number" formControlName="sizeHeightCm" [min]="0" [step]="0.1" />
      </div>
    </section>
  }

  @if (showProductionFields && is3D) {
    @if (isResina) {
      <section class="form-block resin-color">
        <h4>Color de resina</h4>
        <db-color-select
          appearance="popover"
          formControlName="colorId"
          [resinType]="form.controls.resinType.value"
        />
      </section>
    }
    <app-order-quote-3d-composition
      [line]="line"
      [lineIndex]="0"
      [showProcessToggle]="false"
      [printProcess]="printProcess"
      (changed)="onQuoteChanged()"
    />
  }

  @if (showProductionFields && isEstampado) {
    <app-order-quote-estampado-composition
      [line]="line"
      [lineIndex]="0"
      (changed)="onQuoteChanged()"
    />
  }
</div>
