<section class="form-block">
  <h4>Tipo de producto</h4>
  <div class="type-switch" role="tablist">
    @for (option of productTypeOptions; track option.value) {
      <button
        type="button"
        class="type-switch__item"
        [class.type-switch__item--active]="type === option.value"
        (click)="selectType(option.value)"
      >
        {{ typeLabel(option.value) }}
      </button>
    }
  </div>
</section>

<section class="form-block">
  <h4>Datos del producto</h4>
  <div class="data-row">
    <db-input
      label="Nombre"
      name="name"
      [(ngModel)]="name"
      [ngModelOptions]="{ standalone: true }"
      placeholder="Ej.: Árbol de equilibrio"
      [required]="true"
      (ngModelChange)="onFieldChange()"
    />
    <db-input
      label="Stock terminado"
      type="number"
      name="finishedStock"
      [min]="0"
      [step]="1"
      [(ngModel)]="finishedStock"
      [ngModelOptions]="{ standalone: true }"
      (ngModelChange)="onFieldChange()"
    />
  </div>

  @if (showIncludesPiecesCheckbox) {
    <div class="product-flags">
      <div class="flag">
        <db-checkbox
          label="Publicado en catálogo"
          name="published"
          [(ngModel)]="published"
          [ngModelOptions]="{ standalone: true }"
          (ngModelChange)="onFieldChange()"
        />
        <small>Desactivalo para piezas de uso interno</small>
      </div>
      <div class="flag">
        <db-checkbox
          label="Incluye piezas"
          name="includesPieces"
          [(ngModel)]="includesPieces"
          [ngModelOptions]="{ standalone: true }"
          (checkedChange)="onIncludesPiecesChange($event)"
          (ngModelChange)="onFieldChange()"
        />
        <small>Se arma con otros productos del catálogo</small>
      </div>
    </div>
  }
</section>
