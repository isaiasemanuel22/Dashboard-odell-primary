<section class="form-block armado-block">
  <h4>Armado</h4>
  <div class="armado-block__row">
    <db-input
      label="Tiempo de armado (h)"
      name="assemblyTimeHours"
      type="number"
      [ngModel]="assemblyTimeHours"
      (ngModelChange)="assemblyTimeHoursChange.emit($event); changed.emit()"
      [ngModelOptions]="{ standalone: true }"
      [min]="0"
      [step]="0.05"
      [required]="true"
      [hint]="assemblyHint"
    />
    <div class="flag">
      <db-checkbox
        label="Descontar piezas del stock al vender"
        name="deductPiecesOnSale"
        [ngModel]="deductPiecesOnSale"
        (ngModelChange)="deductPiecesOnSaleChange.emit($event)"
        [ngModelOptions]="{ standalone: true }"
      />
      <small>Cuando se vende, se restan las piezas en lugar del producto armado.</small>
    </div>
  </div>
</section>
