<section class="form-block">
  <h4>Imágenes y archivos</h4>
  <div class="media-grid">
    <div class="media-card">
      <p class="media-card__title">Fotos y reels</p>
      <p class="media-card__hint">Arrastralas o</p>
      @if (facade.legacyImagesNotice) {
        <p class="media-card__hint">{{ facade.legacyImagesNotice }}</p>
      }
      <div [formGroup]="facade.form">
        <db-file-upload
          formControlName="images"
          [thumbAlt]="facade.name"
          [uploadFn]="uploadProductImage"
        />
      </div>
      <p class="media-card__note">La primera es la portada</p>
    </div>

    <div class="media-card">
      <p class="media-card__title">Archivos adjuntos</p>
      <p class="media-card__hint">STL, 3MF, PDF o referencias</p>
      <div [formGroup]="facade.form">
        <db-attachment-upload
          formControlName="attachments"
          [uploadFn]="uploadProductAttachment"
        />
      </div>
      <p class="media-card__note">Solo los ve el equipo</p>
      @if (facade.attachmentUploadError) {
        <db-form-error>{{ facade.attachmentUploadError }}</db-form-error>
      }
    </div>
  </div>
</section>
