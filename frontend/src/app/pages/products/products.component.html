<app-products-toolbar
  [publishedCount]="publishedCount"
  [inStockCount]="inStockCount"
  [cartItemCount]="cartItemCount"
  [catalogFilters]="catalogFilters"
  [catalogView]="catalogView"
  (catalogViewChange)="setCatalogView($event)"
  [search]="search"
  (searchChange)="search = $event"
  [typeFilters]="typeFilters"
  [typeFilter]="typeFilter"
  (typeFilterChange)="setTypeFilter($event)"
  [categoryFilterOptions]="categoryFilterOptions"
  [categoryFilter]="categoryFilter"
  (categoryFilterChange)="categoryFilter = $event"
  (newCategory)="openCategoryForm()"
  (newProduct)="openCreateProduct()"
/>

@if (cartNotice) {
  <p class="products-cart-notice">{{ cartNotice }}</p>
}

@if (loading) {
  <db-skeleton variant="cards" [count]="6" />
} @else {
  <db-state-message
    [loading]="false"
    [empty]="filteredProducts.length === 0"
    [emptyMessage]="emptyMessage"
  >
    <db-button
      emptyActions
      label="Crear primer producto"
      variant="primary"
      format="solid"
      (clicked)="openCreateProduct()"
    />
  </db-state-message>

  @if (filteredProducts.length) {
    <div class="products-grid">
      @for (product of filteredProducts; track product.id) {
        <app-product-card
          [product]="product"
          [categories]="categories"
          [showAddToCart]="true"
          (edit)="openEditProduct($event)"
          (delete)="deleteProduct($event)"
          (addToCart)="addProductToCart($event)"
        />
      }
    </div>
  }
}
