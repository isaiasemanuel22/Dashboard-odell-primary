<header class="page-header">
  <div>
    <h2>Productos</h2>
    <p>
      Catálogo de impresión 3D (FDM / Resina) y estampados · {{ publishedCount }} publicados
      · {{ inStockCount }} con stock
    </p>
  </div>
  <div class="header-actions">
    <db-button
      [label]="'Carrito (' + cartItemCount + ')'"
      variant="secondary"
      format="soft"
      routerLink="/ventas/nueva"
    />
    <db-button
      label="+ Categoría"
      variant="secondary"
      format="soft"
      (clicked)="openCategoryForm()"
    />
    <db-button
      label="+ Nuevo producto"
      variant="primary"
      format="solid"
      (clicked)="openCreateProduct()"
    />
  </div>
</header>

<div class="list-toolbar">
  <db-pill-group
    [options]="catalogFilters"
    [value]="catalogView"
    ariaLabel="Publicación"
    (valueChange)="setCatalogView($event)"
  />
  <label class="list-search">
    <span aria-hidden="true">⌕</span>
    <input
      type="search"
      placeholder="Buscar producto o categoría"
      [(ngModel)]="search"
    />
  </label>
</div>

<db-pill-group
  class="list-areas"
  [options]="typeFilters"
  [value]="typeFilter"
  label="Tipo"
  size="sm"
  ariaLabel="Filtrar por tipo"
  (valueChange)="setTypeFilter($event)"
/>

<db-pill-group
  class="list-areas"
  [options]="categoryFilterOptions"
  [value]="categoryFilter"
  label="Categoría"
  size="sm"
  ariaLabel="Filtrar por categoría"
  (valueChange)="categoryFilter = $event"
/>

@if (loading) {
  <db-skeleton variant="cards" [count]="6" />
} @else {
  <db-state-message
    [loading]="false"
    [empty]="filteredProducts.length === 0"
    [emptyMessage]="emptyMessage"
  >
    <db-button
      emptyActions
      label="Crear primer producto"
      variant="primary"
      format="solid"
      (clicked)="openCreateProduct()"
    />
  </db-state-message>

  @if (filteredProducts.length) {
    <div class="products-grid">
      @for (product of filteredProducts; track product.id) {
        <app-product-card
          [product]="product"
          [categories]="categories"
          [showAddToCart]="true"
          (edit)="openEditProduct($event)"
          (delete)="deleteProduct($event)"
          (addToCart)="addProductToCart($event)"
        />
      }
    </div>
  }
}
